<!-- OB first photos early v2 · starts the photos at the top of the page loading straight away, instead of waiting for Squarespace's own script (about 1 second later). Same files Squarespace asks for, so nothing downloads twice. v2: on product pages the first photo also gets its address straight away, so the page's short wait (Header, up to 0.8s) ends as soon as that photo is ready. -->
<script>
(function () {
  try {
    if (!document.querySelector || /[?&]ob-popup=/.test(location.search)) return;
    var STEPS = [100, 300, 500, 750, 1000, 1500, 2500];
    var MAX = 4;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vh = window.innerHeight || 800;
    var done = {};
    var count = 0;

    var boxOf = function (img) {
      var el = img;
      for (var i = 0; el && i < 4; i++, el = el.parentElement) {
        var r = el.getBoundingClientRect();
        if (r.width > 0) return r;
      }
      return null;
    };

    var pick = function (img, w) {
      var need = w * dpr;
      var set = img.getAttribute("srcset");
      if (set && /\d+w/.test(set)) {
        var best = null, biggest = null;
        set.split(/,\s+/).forEach(function (part) {
          var m = /^(\S+)\s+(\d+)w$/.exec(part.trim());
          if (!m) return;
          var c = { url: m[1], w: +m[2] };
          if (!biggest || c.w > biggest.w) biggest = c;
          if (c.w >= need && (!best || c.w < best.w)) best = c;
        });
        return (best || biggest || {}).url || null;
      }
      var src = img.getAttribute("data-src");
      if (!src || /\?/.test(src)) return null;
      for (var i = 0; i < STEPS.length; i++) {
        if (STEPS[i] >= need) return src + "?format=" + STEPS[i] + "w";
      }
      return src + "?format=" + STEPS[STEPS.length - 1] + "w";
    };

    var start = function (url) {
      if (!url || done[url]) return;
      done[url] = true;
      count++;
      var l = document.createElement("link");
      l.rel = "preload";
      l.as = "image";
      l.href = url;
      l.setAttribute("fetchpriority", "high");
      document.head.appendChild(l);
    };

    var sel = ".product-gallery-slides-item img, main .product-list-item img.grid-item-image, main .sqs-block-image img";
    var imgs = document.querySelectorAll(sel);
    var gallery = false;
    for (var i = 0; i < imgs.length && count < MAX; i++) {
      var img = imgs[i];
      var inGallery = !!img.closest(".product-gallery-slides-item");
      if (inGallery) {
        if (gallery) continue;
        gallery = true;
      }
      var r = boxOf(img);
      if (!r || r.height <= 0) continue;
      if (!inGallery && (r.top >= vh || r.bottom <= 0)) continue;
      var url = pick(img, r.width);
      start(url);
      if (inGallery && url && !img.getAttribute("src")) img.setAttribute("src", url);
    }
  } catch (e) {}
})();
</script>
