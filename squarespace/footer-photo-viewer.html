<!-- OB PHOTO VIEWER v2 · product pages: click or tap a photo and it opens full screen over the page, which shows through blurred. Swipe (phones), arrows or the arrow keys move between the photos, round and round (after the last comes the first); CLOSE, Escape or the browser's back gesture closes it, back on the photo you were looking at. On a computer, a click on the big photo zooms it to the full width of the screen (move the mouse up and down to look along it), a second click zooms out. v2: blurred page behind, photos loop, zoom fills the screen width, and the page photos keep their hover label after closing. On a computer the pointer over a photo becomes a small square with a frosted chip hanging off it that trails it slightly ([ENLARGE] on the page, [ZOOM IN] / [ZOOM OUT] in the viewer; no trail with reduced motion); on phones [ENLARGE] sits in the corner of the photo. The words: viewer in OB SETTINGS. Only the photo on screen and its neighbours load, at full size; the smaller copy already on the page shows until then. -->
<style>
.product-gallery-slides-item,.product-gallery-slides-item img{cursor:pointer}
@media (hover:hover) and (pointer:fine){.product-gallery-slides-item,.product-gallery-slides-item img,.obPvSlide img{cursor:none!important}}
.obPvTip{position:fixed;left:0;top:0;z-index:2147483001;pointer-events:none;opacity:0;transition:opacity .2s}
.obPvTip.obPvTipOn{opacity:1}
.obPvTip i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;background:#111;border:1px solid rgba(255,255,250,.7);box-sizing:border-box}
.obPvTip b{position:absolute;left:12px;top:12px;display:block;padding:5px 9px;border-radius:5px;border:1px solid rgba(17,17,17,.08);background:rgba(255,255,250,.45);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#111;font:500 12px/1 ot-geist-mono-1st64u,ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.obPvTip b{background:rgba(255,255,250,.92)}}
.obPvTag{display:none}
@media (hover:none){.obPvTag{display:block;position:absolute;right:8px;bottom:8px;z-index:2;pointer-events:none;padding:5px 7px;border-radius:5px;background:rgba(255,255,250,.88);color:#111;font:11px/1 ot-geist-mono-1st64u,ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}}
.product-gallery-slides-item::after{pointer-events:none}
.product-gallery-slides-item:focus:not(:focus-visible)::after{display:none}
.obPv{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:#111;overflow:hidden;font-family:ot-geist-mono-1st64u,ui-monospace,SFMono-Regular,Menlo,monospace;z-index:2147483000}
.obPv::backdrop{background:rgba(255,255,250,.7);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.obPv::backdrop{background:#fffffa}}
.obPv:not([open]){display:none}
.obPvTrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.obPvTrack::-webkit-scrollbar{display:none}
.obPvSlide{flex:0 0 100%;width:100%;height:100%;margin:0;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:64px 24px 56px;box-sizing:border-box;overflow:hidden}
.obPvSlide img{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;cursor:zoom-in;transition:transform .25s cubic-bezier(.25,.1,.25,1)}
.obPv.obPvZoom .obPvSlide.obPvHere img{transition:none}
.obPv.obPvZoom .obPvTrack{overflow-x:hidden}
.obPvBar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;pointer-events:none;font-size:14px;line-height:1;letter-spacing:0;text-transform:uppercase}
.obPvBar>*{pointer-events:auto}
.obPvCount{font-variant-numeric:tabular-nums}
.obPv button{appearance:none;-webkit-appearance:none;margin:0;border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.obPvClose{padding:8px 0 8px 16px}
.obPvClose:hover,.obPvClose:focus-visible{text-decoration:underline;text-underline-offset:3px}
.obPvNav{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;display:flex;align-items:center;justify-content:center;border-radius:999px!important;background:rgba(230,228,222,.62)!important;font-size:18px!important;line-height:1}
.obPvNav:hover{background:rgba(214,211,203,.8)!important}
.obPvPrev{left:24px}
.obPvNext{right:24px}
.obPv button:focus-visible{outline:2px solid #111;outline-offset:3px}
.obPv.obPvZoom .obPvNav{opacity:0;pointer-events:none}
.obPv.obPvOne .obPvNav,.obPv.obPvOne .obPvCount{visibility:hidden}
.obPvLive{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:768px){.obPvSlide{padding:72px 96px 48px}}
@media (max-width:767px){
.obPvBar{padding:10px 16px;font-size:13px}
.obPvSlide{padding:56px 0 40px}
.obPvNav{display:none}
.obPvSlide img{cursor:default}
}
@media (prefers-reduced-motion:reduce){.obPvSlide img{transition:none}}
</style>
<script>
(function () {
  try {
    if (!window.HTMLDialogElement || !document.querySelector) return;
    var WORDS = { close: { en: "Close", it: "Chiudi" }, of: { en: "of", it: "di" }, prev: { en: "Previous photo", it: "Foto precedente" }, next: { en: "Next photo", it: "Foto successiva" }, open: { en: "Open photo full screen", it: "Apri la foto a schermo intero" } };
    var lang = function () {
      try { if (window.Weglot && Weglot.initialized && Weglot.getCurrentLang) return Weglot.getCurrentLang(); } catch (e) {}
      try { var w = localStorage.getItem("wglang"); if (w) return w.slice(0, 2).toLowerCase(); } catch (e) {}
      return (document.documentElement.lang || "en").slice(0, 2).toLowerCase();
    };
    WORDS.enlarge = { en: "[Enlarge]", it: "[Ingrandisci]" };
    WORDS.zoomIn = { en: "[Zoom in]", it: "[Zoom]" };
    WORDS.zoomOut = { en: "[Zoom out]", it: "[Riduci]" };
    var t = function (k) {
      var c = (window.OB_CONF || {}).viewer || {}, w = c[k] || WORDS[k];
      if (typeof w === "string") return w;
      return (w && (w[lang()] || w.en)) || WORDS[k].en;
    };
    var phone = function () { return window.matchMedia("(max-width: 767px)").matches; };
    var SLIDES = ".product-gallery-slides-item";

    var dlg, track, count, live, prev, next, closeBtn, list = [], here = 0, opener = null, pushed = false, scrollT, loop = false;
    /* with more than one photo the row is: a copy of the last, the photos, a copy of the first, so a swipe past either end carries on round */
    var posOf = function (i) { return loop ? i + 1 : i; };
    var realOf = function (p) { if (!loop) return p; var n = list.length; return (p - 1 + n) % n; };

    var photos = function () {
      var out = [];
      var items = document.querySelectorAll(SLIDES);
      for (var i = 0; i < items.length; i++) {
        var im = items[i].querySelector("img");
        if (!im) continue;
        var src = im.getAttribute("data-image") || im.getAttribute("data-src") || "";
        if (!src) { src = (im.currentSrc || im.getAttribute("src") || "").split("?")[0]; }
        if (!src) continue;
        out.push({ src: src.split("?")[0], now: im.currentSrc || "", alt: im.getAttribute("alt") || "", dims: im.getAttribute("data-image-dimensions") || "", item: items[i] });
      }
      return out;
    };

    var srcset = function (p) {
      var d = /^(\d+)x/.exec(p.dims), max = d ? +d[1] : 2500, out = [];
      [750, 1000, 1500, 2500].forEach(function (w) { if (w < max) out.push(p.src + "?format=" + w + "w " + w + "w"); });
      out.push(p.src + "?format=" + (max >= 2500 ? 2500 : 1500) + "w " + Math.min(max, 2500) + "w");
      return out.join(", ");
    };

    var load = function (i) {
      if (!track || !list.length) return;
      i = (i + list.length) % list.length;
      for (var p = 0; p < track.children.length; p++) { if (realOf(p) === i) loadAt(p, i); }
    };
    var loadAt = function (p, i) {
      var im = track.children[p].querySelector("img");
      if (im && !im.getAttribute("src")) {
        im.onload = function () { this.style.background = "none"; };
        im.setAttribute("sizes", "100vw");
        im.setAttribute("srcset", srcset(list[i]));
        im.setAttribute("src", list[i].src + "?format=1500w");
      }
    };

    var build = function () {
      dlg = document.createElement("dialog");
      dlg.className = "obPv";
      dlg.setAttribute("aria-label", "Photos");
      dlg.innerHTML = '<div class="obPvTrack"></div>' +
        '<div class="obPvBar"><span class="obPvCount" aria-hidden="true"></span><button type="button" class="obPvClose"></button></div>' +
        '<button type="button" class="obPvNav obPvPrev">&larr;</button><button type="button" class="obPvNav obPvNext">&rarr;</button>' +
        '<div class="obPvLive" aria-live="polite"></div>';
      track = dlg.querySelector(".obPvTrack");
      count = dlg.querySelector(".obPvCount");
      live = dlg.querySelector(".obPvLive");
      prev = dlg.querySelector(".obPvPrev");
      next = dlg.querySelector(".obPvNext");
      closeBtn = dlg.querySelector(".obPvClose");
      document.body.appendChild(dlg);

      closeBtn.addEventListener("click", function () { close(); });
      prev.addEventListener("click", function () { go(here - 1); });
      next.addEventListener("click", function () { go(here + 1); });
      dlg.addEventListener("cancel", function (e) { e.preventDefault(); close(); });
      dlg.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); go(here + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); go(here - 1); }
        else if (e.key === "Home") { e.preventDefault(); go(0, true); }
        else if (e.key === "End") { e.preventDefault(); go(list.length - 1, true); }
      });
      track.addEventListener("scroll", function () {
        clearTimeout(scrollT);
        scrollT = setTimeout(function () {
          var w = track.clientWidth || 1;
          var p = Math.round(track.scrollLeft / w);
          if (loop && (p === 0 || p === list.length + 1)) jump(p === 0 ? list.length : 1);
          var i = realOf(p);
          if (i !== here) set(i);
        }, 80);
      }, { passive: true });

      /* computer: click the photo to zoom in, move to look around, click again to zoom out */
      var zoomed = null;
      var aim = function (e) {
        if (!zoomed) return;
        var r = zoomed.parentNode.getBoundingClientRect();
        var x = zoomed.__lockX ? 0.5 : (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        zoomed.style.transformOrigin = (Math.max(0, Math.min(1, x)) * 100) + "% " + (Math.max(0, Math.min(1, y)) * 100) + "%";
      };
      var unzoom = function () {
        if (!zoomed) return;
        zoomed.style.transform = "";
        zoomed = null;
        dlg.classList.remove("obPvZoom");
      };
      track.addEventListener("click", function (e) {
        var im = e.target.closest && e.target.closest(".obPvSlide img");
        if (!im) { if (zoomed) unzoom(); else if (e.target.classList.contains("obPvSlide")) close(); return; }
        if (phone()) return;
        if (zoomed) { unzoom(); return; }
        var nat = im.naturalWidth || 0, box = im.getBoundingClientRect(), shown = Math.min(box.width, box.height * nat / (im.naturalHeight || 1)) || 1;
        /* zoom until the photo is as wide as the screen; a photo that is already nearly that wide just doubles */
        var k = (track.clientWidth || window.innerWidth) / shown;
        im.__lockX = k >= 1.5;
        if (k < 1.5) k = 2;
        k = Math.min(k, 5);
        zoomed = im;
        dlg.classList.add("obPvZoom");
        aim(e);
        im.style.transform = "scale(" + k + ")";
      });
      track.addEventListener("mousemove", aim);
      dlg.__unzoom = unzoom;
    };

    var jump = function (p) {
      track.style.scrollSnapType = "none";
      track.scrollLeft = p * track.clientWidth;
      void track.offsetWidth;
      track.style.scrollSnapType = "";
    };
    var set = function (i) {
      here = i;
      if (dlg.__unzoom) dlg.__unzoom();
      for (var k = 0; k < track.children.length; k++) track.children[k].classList.toggle("obPvHere", k === posOf(i));
      load(i); load(i + 1); load(i - 1);
      count.textContent = (i + 1) + " / " + list.length;
      live.textContent = (i + 1) + " " + t("of") + " " + list.length;
    };
    /* move to photo i; past the last comes the first and before the first the last */
    var go = function (i, direct) {
      var n = list.length;
      if (n < 2) return;
      var p = loop && !direct ? (i < 0 ? 0 : i >= n ? n + 1 : posOf(i)) : posOf((i + n) % n);
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      set((i + n) % n);
      if (reduce) { jump(posOf((i + n) % n)); return; }
      track.scrollTo({ left: p * track.clientWidth, behavior: "smooth" });
    };

    var open = function (start, from) {
      list = photos();
      if (!list.length) return;
      if (!dlg) build();
      opener = from || document.activeElement;
      closeBtn.textContent = t("close");
      prev.setAttribute("aria-label", t("prev"));
      next.setAttribute("aria-label", t("next"));
      loop = list.length > 1;
      var slide = function (i, copy) {
        var d = /^(\d+)x(\d+)$/.exec(list[i].dims);
        return '<figure class="obPvSlide"' + (copy ? ' aria-hidden="true"' : ' role="group" aria-roledescription="slide" aria-label="' + (i + 1) + " " + t("of") + " " + list.length + '"') + '><img alt="' + (copy ? "" : list[i].alt.replace(/"/g, "&quot;")) + '"' + (d ? ' width="' + d[1] + '" height="' + d[2] + '"' : "") + ' decoding="async" draggable="false"' + (list[i].now ? ' style="background:url(&quot;' + list[i].now.replace(/"/g, "%22") + '&quot;) center / contain no-repeat"' : "") + '></figure>';
      };
      var html = loop ? slide(list.length - 1, true) : "";
      for (var i = 0; i < list.length; i++) html += slide(i, false);
      if (loop) html += slide(0, true);
      track.innerHTML = html;
      dlg.classList.toggle("obPvOne", list.length < 2);
      document.documentElement.style.overflow = "hidden";
      dlg.showModal();
      here = -1;
      jump(posOf(start));
      set(start);
      closeBtn.focus({ preventScroll: true });
      try { history.pushState({ obPv: 1 }, ""); pushed = true; } catch (e) { pushed = false; }
    };

    var after = null;
    var close = function (fromHistory) {
      if (!dlg || !dlg.open) return;
      if (dlg.__unzoom) dlg.__unzoom();
      var last = here;
      dlg.close();
      document.documentElement.style.overflow = "";
      /* back on the page: show the photo you were looking at (after the browser has finished going back) */
      var finish = function () {
        var p = list[last];
        if (p && p.item) {
          if (phone()) {
            if (!p.item.classList.contains("selected")) {
              var thumbs = document.querySelectorAll(".product-gallery-thumbnails-item");
              var dots = document.querySelectorAll("#obGalleryDots .obGalleryDot");
              if (thumbs[last]) thumbs[last].click(); else if (dots[last]) dots[last].click();
            }
          } else {
            var r = p.item.getBoundingClientRect();
            if (r.bottom < 80 || r.top > window.innerHeight - 80) window.scrollTo(0, Math.max(0, window.pageYOffset + r.top - 40));
          }
        }
        setTimeout(function () {
          mark();
          var back = phone() ? document.querySelector(SLIDES + ".selected") : (p && p.item);
          back = back || opener;
          try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
        }, 60);
      };
      if (pushed && !fromHistory) {
        pushed = false;
        after = finish;
        try { history.back(); } catch (e) {}
        setTimeout(function () { if (after) { var f = after; after = null; f(); } }, 500);
      } else {
        pushed = false;
        finish();
      }
    };
    window.addEventListener("popstate", function () {
      if (after) { var f = after; after = null; setTimeout(f, 30); return; }
      if (dlg && dlg.open) close(true);
    });

    /* a tap, not a swipe: on phones the photos swipe sideways, so only a still touch opens */
    var down = null;
    document.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; }, { capture: true, passive: true });
    var indexOf = function (item) {
      var items = document.querySelectorAll(SLIDES), n = 0;
      for (var i = 0; i < items.length; i++) { if (!items[i].querySelector("img")) continue; if (items[i] === item) return n; n++; }
      return 0;
    };
    document.addEventListener("click", function (e) {
      if (!document.body.classList.contains("view-item")) return;
      var item = e.target.closest && e.target.closest(SLIDES);
      if (!item || !item.querySelector("img")) return;
      if (down && (Math.abs(e.clientX - down.x) > 10 || Math.abs(e.clientY - down.y) > 10)) return;
      e.preventDefault();
      open(indexOf(item), item);
    });

    /* computers: over a photo the pointer becomes a small square with a frosted word hanging off it, which trails it slightly */
    var tip = document.createElement("div");
    tip.className = "obPvTip";
    tip.setAttribute("aria-hidden", "true");
    tip.setAttribute("data-wg-notranslate", "");
    tip.innerHTML = "<i></i><b></b>";
    var sq = tip.firstChild, chip = tip.lastChild;
    var tipWord = function (el) {
      if (!el || !el.closest) return "";
      if (el.closest(".obPvSlide img")) return dlg && dlg.classList.contains("obPvZoom") ? t("zoomOut") : (phone() ? "" : t("zoomIn"));
      if (!dlg || !dlg.open) { var it = el.closest(SLIDES); if (it && it.querySelector("img") && document.body.classList.contains("view-item")) return t("enlarge"); }
      return "";
    };
    var mx = 0, my = 0, cx = 0, cy = 0, on = false, raf = 0, lastE = null;
    var still = function () { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; };
    var draw = function () {
      raf = 0;
      if (still()) { cx = mx; cy = my; } else { cx += (mx - cx) * 0.22; cy += (my - cy) * 0.22; }
      sq.style.transform = "translate(" + mx + "px," + my + "px)";
      chip.style.transform = "translate(" + cx.toFixed(1) + "px," + cy.toFixed(1) + "px)";
      if (Math.abs(mx - cx) > 0.3 || Math.abs(my - cy) > 0.3) raf = requestAnimationFrame(draw);
    };
    var tipAt = function (e) {
      if (!e) return;
      lastE = { clientX: e.clientX, clientY: e.clientY, pointerType: e.pointerType };
      if (e.pointerType && e.pointerType !== "mouse") { tip.classList.remove("obPvTipOn"); on = false; return; }
      var home = dlg && dlg.open ? dlg : document.body;
      if (tip.parentNode !== home) home.appendChild(tip);
      var w = tipWord(document.elementFromPoint(e.clientX, e.clientY));
      if (!w) { tip.classList.remove("obPvTipOn"); on = false; return; }
      if (chip.textContent !== w) chip.textContent = w;
      mx = e.clientX; my = e.clientY;
      if (!on) { cx = mx; cy = my; on = true; }
      tip.classList.add("obPvTipOn");
      if (!raf) raf = requestAnimationFrame(draw);
    };
    var tipAgain = function () { setTimeout(function () { tipAt(lastE); }, 40); };
    document.addEventListener("pointermove", tipAt, { passive: true });
    document.addEventListener("pointerup", tipAgain, { passive: true });
    document.addEventListener("keyup", tipAgain, { passive: true });
    window.addEventListener("scroll", tipAgain, { passive: true });
    document.documentElement.addEventListener("pointerleave", function () { tip.classList.remove("obPvTipOn"); on = false; });

    /* phones: [ENLARGE] in the corner of each photo */
    var tags = function () {
      var items = document.querySelectorAll(SLIDES);
      for (var i = 0; i < items.length; i++) {
        if (!items[i].querySelector("img")) continue;
        var g = items[i].querySelector(".obPvTag");
        if (!g) { g = document.createElement("span"); g.className = "obPvTag"; g.setAttribute("aria-hidden", "true"); g.setAttribute("data-wg-notranslate", ""); items[i].appendChild(g); }
        if (g.textContent !== t("enlarge")) g.textContent = t("enlarge");
      }
    };

    /* keyboard: each photo on the page can be reached with Tab and opened with Enter or Space */
    var mark = function () {
      if (!document.body.classList.contains("view-item")) return;
      tags();
      var items = document.querySelectorAll(SLIDES);
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.querySelector("img")) continue;
        var visible = !phone() || it.classList.contains("selected");
        var want = visible ? "0" : "-1";
        if (it.getAttribute("tabindex") !== want) it.setAttribute("tabindex", want);
        if (it.getAttribute("role") !== "button") it.setAttribute("role", "button");
        if (!it.getAttribute("aria-label")) it.setAttribute("aria-label", t("open"));
      }
    };
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var item = e.target.closest && e.target.closest(SLIDES);
      if (!item || e.target !== item) return;
      e.preventDefault();
      open(indexOf(item), item);
    });
    document.addEventListener("focusin", function (e) { if (e.target.closest && e.target.closest(".product-gallery")) mark(); });
    var tries = 0;
    var tick = function () { mark(); if (++tries < 12) setTimeout(tick, 500); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick); else tick();
    window.addEventListener("load", function () { setTimeout(mark, 500); });
  } catch (e) {}
})();
</script>
