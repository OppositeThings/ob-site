<!-- OB PHOTO VIEWER v1 · product pages: click or tap a photo and it opens full screen. Swipe (phones), arrows or the arrow keys move between the photos; CLOSE, Escape or the browser's back gesture closes it, back on the photo you were looking at. On a computer, a click on the big photo zooms in to see the detail (move the mouse to look around), a second click zooms out. Only the photo on screen and its neighbours load, at full size. -->
<style>
.product-gallery-slides-item img{cursor:zoom-in}
.obPv{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#fffffa;color:#111;overflow:hidden;font-family:ot-geist-mono-1st64u,ui-monospace,SFMono-Regular,Menlo,monospace;z-index:2147483000}
.obPv::backdrop{background:#fffffa}
.obPv:not([open]){display:none}
.obPvTrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.obPvTrack::-webkit-scrollbar{display:none}
.obPvSlide{flex:0 0 100%;width:100%;height:100%;margin:0;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:64px 24px 56px;box-sizing:border-box;overflow:hidden}
.obPvSlide img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;cursor:zoom-in;transition:transform .25s cubic-bezier(.25,.1,.25,1)}
.obPv.obPvZoom .obPvSlide.obPvHere img{cursor:zoom-out;transition:none}
.obPv.obPvZoom .obPvTrack{overflow-x:hidden}
.obPvBar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;pointer-events:none;font-size:14px;line-height:1;letter-spacing:0;text-transform:uppercase}
.obPvBar>*{pointer-events:auto}
.obPvCount{font-variant-numeric:tabular-nums}
.obPv button{appearance:none;-webkit-appearance:none;margin:0;border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.obPvClose{padding:8px 0 8px 16px}
.obPvClose:hover,.obPvClose:focus-visible{text-decoration:underline;text-underline-offset:3px}
.obPvNav{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;display:flex;align-items:center;justify-content:center;border-radius:999px!important;background:rgba(230,228,222,.62)!important;font-size:18px!important;line-height:1}
.obPvNav:hover{background:rgba(214,211,203,.8)!important}
.obPvNav[disabled]{opacity:0;pointer-events:none}
.obPvPrev{left:24px}
.obPvNext{right:24px}
.obPv button:focus-visible{outline:2px solid #111;outline-offset:3px}
.obPv.obPvZoom .obPvNav{opacity:0;pointer-events:none}
.obPv.obPvOne .obPvNav,.obPv.obPvOne .obPvCount{visibility:hidden}
.obPvLive{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:768px){.obPvSlide{padding:72px 96px 48px}}
@media (max-width:767px){
.obPvBar{padding:10px 16px;font-size:13px}
.obPvSlide{padding:56px 0 40px}
.obPvNav{display:none}
.obPvSlide img{cursor:default}
}
@media (prefers-reduced-motion:reduce){.obPvSlide img{transition:none}}
</style>
<script>
(function () {
  try {
    if (!window.HTMLDialogElement || !document.querySelector) return;
    var WORDS = { close: { en: "Close", it: "Chiudi" }, of: { en: "of", it: "di" }, prev: { en: "Previous photo", it: "Foto precedente" }, next: { en: "Next photo", it: "Foto successiva" }, open: { en: "Open photo full screen", it: "Apri la foto a schermo intero" } };
    var lang = function () {
      try { if (window.Weglot && Weglot.initialized && Weglot.getCurrentLang) return Weglot.getCurrentLang(); } catch (e) {}
      try { var w = localStorage.getItem("wglang"); if (w) return w.slice(0, 2).toLowerCase(); } catch (e) {}
      return (document.documentElement.lang || "en").slice(0, 2).toLowerCase();
    };
    var t = function (k) { var w = WORDS[k]; return w[lang()] || w.en; };
    var phone = function () { return window.matchMedia("(max-width: 767px)").matches; };
    var SLIDES = ".product-gallery-slides-item";

    var dlg, track, count, live, prev, next, closeBtn, list = [], here = 0, opener = null, pushed = false, scrollT;

    var photos = function () {
      var out = [];
      var items = document.querySelectorAll(SLIDES);
      for (var i = 0; i < items.length; i++) {
        var im = items[i].querySelector("img");
        if (!im) continue;
        var src = im.getAttribute("data-image") || im.getAttribute("data-src") || "";
        if (!src) { src = (im.currentSrc || im.getAttribute("src") || "").split("?")[0]; }
        if (!src) continue;
        out.push({ src: src.split("?")[0], alt: im.getAttribute("alt") || "", dims: im.getAttribute("data-image-dimensions") || "", item: items[i] });
      }
      return out;
    };

    var srcset = function (s) { return [750, 1000, 1500, 2500].map(function (w) { return s + "?format=" + w + "w " + w + "w"; }).join(", "); };

    var load = function (i) {
      var sl = track && track.children[i];
      if (!sl) return;
      var im = sl.querySelector("img");
      if (im && !im.getAttribute("src")) {
        im.setAttribute("sizes", "100vw");
        im.setAttribute("srcset", srcset(list[i].src));
        im.setAttribute("src", list[i].src + "?format=1500w");
      }
    };

    var build = function () {
      dlg = document.createElement("dialog");
      dlg.className = "obPv";
      dlg.setAttribute("aria-label", "Photos");
      dlg.innerHTML = '<div class="obPvTrack"></div>' +
        '<div class="obPvBar"><span class="obPvCount" aria-hidden="true"></span><button type="button" class="obPvClose"></button></div>' +
        '<button type="button" class="obPvNav obPvPrev">&larr;</button><button type="button" class="obPvNav obPvNext">&rarr;</button>' +
        '<div class="obPvLive" aria-live="polite"></div>';
      track = dlg.querySelector(".obPvTrack");
      count = dlg.querySelector(".obPvCount");
      live = dlg.querySelector(".obPvLive");
      prev = dlg.querySelector(".obPvPrev");
      next = dlg.querySelector(".obPvNext");
      closeBtn = dlg.querySelector(".obPvClose");
      document.body.appendChild(dlg);

      closeBtn.addEventListener("click", function () { close(); });
      prev.addEventListener("click", function () { go(here - 1); });
      next.addEventListener("click", function () { go(here + 1); });
      dlg.addEventListener("cancel", function (e) { e.preventDefault(); close(); });
      dlg.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); go(here + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); go(here - 1); }
        else if (e.key === "Home") { e.preventDefault(); go(0); }
        else if (e.key === "End") { e.preventDefault(); go(list.length - 1); }
      });
      track.addEventListener("scroll", function () {
        clearTimeout(scrollT);
        scrollT = setTimeout(function () {
          var w = track.clientWidth || 1;
          var i = Math.round(track.scrollLeft / w);
          if (i !== here) set(i, true);
        }, 60);
      }, { passive: true });

      /* computer: click the photo to zoom in, move to look around, click again to zoom out */
      var zoomed = null;
      var aim = function (e) {
        if (!zoomed) return;
        var r = zoomed.parentNode.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        zoomed.style.transformOrigin = (Math.max(0, Math.min(1, x)) * 100) + "% " + (Math.max(0, Math.min(1, y)) * 100) + "%";
      };
      var unzoom = function () {
        if (!zoomed) return;
        zoomed.style.transform = "";
        zoomed = null;
        dlg.classList.remove("obPvZoom");
      };
      track.addEventListener("click", function (e) {
        var im = e.target.closest && e.target.closest(".obPvSlide img");
        if (!im) { if (zoomed) unzoom(); else if (e.target.classList.contains("obPvSlide")) close(); return; }
        if (phone()) return;
        if (zoomed) { unzoom(); return; }
        var nat = im.naturalWidth || 0, shown = im.getBoundingClientRect().width || 1;
        var k = Math.max(2, Math.min(3, nat / shown));
        zoomed = im;
        dlg.classList.add("obPvZoom");
        aim(e);
        im.style.transform = "scale(" + k + ")";
      });
      track.addEventListener("mousemove", aim);
      dlg.__unzoom = unzoom;
    };

    var set = function (i, fromScroll) {
      i = Math.max(0, Math.min(list.length - 1, i));
      here = i;
      if (dlg.__unzoom) dlg.__unzoom();
      for (var k = 0; k < track.children.length; k++) track.children[k].classList.toggle("obPvHere", k === i);
      load(i); load(i + 1); load(i - 1);
      count.textContent = (i + 1) + " / " + list.length;
      live.textContent = (i + 1) + " " + t("of") + " " + list.length;
      prev.disabled = i === 0;
      next.disabled = i === list.length - 1;
      if (!fromScroll) {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        track.scrollTo({ left: i * track.clientWidth, behavior: reduce ? "auto" : "smooth" });
      }
    };
    var go = function (i) { if (i >= 0 && i < list.length) set(i, false); };

    var open = function (start, from) {
      list = photos();
      if (!list.length) return;
      if (!dlg) build();
      opener = from || document.activeElement;
      closeBtn.textContent = t("close");
      prev.setAttribute("aria-label", t("prev"));
      next.setAttribute("aria-label", t("next"));
      var html = "";
      for (var i = 0; i < list.length; i++) {
        var d = /^(\d+)x(\d+)$/.exec(list[i].dims);
        html += '<figure class="obPvSlide" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + " " + t("of") + " " + list.length + '"><img alt="' + list[i].alt.replace(/"/g, "&quot;") + '"' + (d ? ' width="' + d[1] + '" height="' + d[2] + '"' : "") + ' decoding="async" draggable="false"></figure>';
      }
      track.innerHTML = html;
      dlg.classList.toggle("obPvOne", list.length < 2);
      document.documentElement.style.overflow = "hidden";
      dlg.showModal();
      here = -1;
      track.scrollLeft = start * track.clientWidth;
      set(start, true);
      closeBtn.focus({ preventScroll: true });
      try { history.pushState({ obPv: 1 }, ""); pushed = true; } catch (e) { pushed = false; }
    };

    var after = null;
    var close = function (fromHistory) {
      if (!dlg || !dlg.open) return;
      if (dlg.__unzoom) dlg.__unzoom();
      var last = here;
      dlg.close();
      document.documentElement.style.overflow = "";
      /* back on the page: show the photo you were looking at (after the browser has finished going back) */
      var finish = function () {
        var p = list[last];
        if (p && p.item) {
          if (phone()) {
            if (!p.item.classList.contains("selected")) {
              var thumbs = document.querySelectorAll(".product-gallery-thumbnails-item");
              var dots = document.querySelectorAll("#obGalleryDots .obGalleryDot");
              if (thumbs[last]) thumbs[last].click(); else if (dots[last]) dots[last].click();
            }
          } else {
            var r = p.item.getBoundingClientRect();
            if (r.bottom < 80 || r.top > window.innerHeight - 80) window.scrollTo(0, Math.max(0, window.pageYOffset + r.top - 40));
          }
        }
        var back = (p && p.item && (!phone() || p.item.classList.contains("selected"))) ? p.item : opener;
        try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
      };
      if (pushed && !fromHistory) {
        pushed = false;
        after = finish;
        try { history.back(); } catch (e) {}
        setTimeout(function () { if (after) { var f = after; after = null; f(); } }, 500);
      } else {
        pushed = false;
        finish();
      }
    };
    window.addEventListener("popstate", function () {
      if (after) { var f = after; after = null; setTimeout(f, 30); return; }
      if (dlg && dlg.open) close(true);
    });

    /* a tap, not a swipe: on phones the photos swipe sideways, so only a still touch opens */
    var down = null;
    document.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; }, { capture: true, passive: true });
    var indexOf = function (item) {
      var items = document.querySelectorAll(SLIDES), n = 0;
      for (var i = 0; i < items.length; i++) { if (!items[i].querySelector("img")) continue; if (items[i] === item) return n; n++; }
      return 0;
    };
    document.addEventListener("click", function (e) {
      if (!document.body.classList.contains("view-item")) return;
      var item = e.target.closest && e.target.closest(SLIDES);
      if (!item || !item.querySelector("img")) return;
      if (down && (Math.abs(e.clientX - down.x) > 10 || Math.abs(e.clientY - down.y) > 10)) return;
      e.preventDefault();
      open(indexOf(item), item);
    });

    /* keyboard: each photo on the page can be reached with Tab and opened with Enter or Space */
    var mark = function () {
      if (!document.body.classList.contains("view-item")) return;
      var items = document.querySelectorAll(SLIDES);
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.querySelector("img")) continue;
        var visible = !phone() || it.classList.contains("selected");
        var want = visible ? "0" : "-1";
        if (it.getAttribute("tabindex") !== want) it.setAttribute("tabindex", want);
        if (it.getAttribute("role") !== "button") it.setAttribute("role", "button");
        if (!it.getAttribute("aria-label")) it.setAttribute("aria-label", t("open"));
      }
    };
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var item = e.target.closest && e.target.closest(SLIDES);
      if (!item || e.target !== item) return;
      e.preventDefault();
      open(indexOf(item), item);
    });
    document.addEventListener("focusin", function (e) { if (e.target.closest && e.target.closest(".product-gallery")) mark(); });
    var tries = 0;
    var tick = function () { mark(); if (++tries < 12) setTimeout(tick, 500); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick); else tick();
    window.addEventListener("load", function () { setTimeout(mark, 500); });
  } catch (e) {}
})();
</script>
