<!-- OB prefetch v1 · goes at the very top of the Header (Header v15.6 = v15.5 + this block, and the line studio: /^\/studio$/, taken out of PAGES). When someone rests the pointer on a link, or starts to tap it, Chrome and Edge fetch that page ahead, so it opens sooner. Safari and Firefox ignore it. Only the page itself is fetched (no scripts run, so visitor stats don't count it). Left out: bag, checkout, account, pop-ups (newsletter, withdraw, Klarna), store categories (the ALL page sorts those in place), and any address with ? in it. -->
<script type="speculationrules">
{
  "prefetch": [{
    "where": {
      "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": [
          "/cart", "/cart/*", "/checkout", "/checkout/*", "/commerce/*", "/account", "/account/*",
          "/api/*", "/s/*", "/newsletter", "/withdraw", "/klarna",
          "/store/:category"
        ] } },
        { "not": { "selector_matches": "[target=_blank], [download], [href^='mailto:'], [href^='tel:'], [href*='?']" } }
      ]
    },
    "eagerness": "moderate"
  }]
}
</script>
